name: Deploy SMWE to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: src
      - name: Deploy to smwe-api via Kudu zipdeploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        run: |
          USER=$(python3 -c "import os,re; x=os.environ['PUBLISH_PROFILE']; print(re.search(r'userName=\"([^\"]+)\"', x).group(1))")
          PASS=$(python3 -c "import os,re; x=os.environ['PUBLISH_PROFILE']; print(re.search(r'userPWD=\"([^\"]+)\"', x).group(1))")
          cd src && zip -r ../app.zip . --exclude 'node_modules/*'
          curl -f -X POST https://smwe-api.scm.azurewebsites.net/api/zipdeploy \
            -u "$USER:$PASS" --data-binary @../app.zip -H "Content-Type: application/zip"

  deploy-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: src
      - uses: azure/webapps-deploy@v3
        with:
          app-name: smwe-mcp
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_MCP }}
          package: src
