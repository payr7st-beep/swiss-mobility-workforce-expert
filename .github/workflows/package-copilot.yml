# ─────────────────────────────────────────────────────────────────────────────
# Package SMWE declarative agent for Microsoft Partner Center / Copilot Studio
#
# Triggers:
#   • push to main          → build a dev snapshot (no release)
#   • tag  v*.*.*           → build + attach to a GitHub Release
#   • workflow_dispatch     → manual run
#
# Required repo secrets:
#   SHAREPOINT_TENANT   e.g.  contoso  (used in knowledge_sources URL)
#
# Required repo files (add before your first tagged release):
#   copilot-studio/icon-color.png    192 × 192 px, full-colour
#   copilot-studio/icon-outline.png   32 ×  32 px, transparent outline
# ─────────────────────────────────────────────────────────────────────────────

name: Package Copilot Agent

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  workflow_dispatch:

jobs:
  package:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Validate icons exist ──────────────────────────────────────────
      - name: Check required icons
        run: |
          MISSING=0
          for f in copilot-studio/icon-color.png copilot-studio/icon-outline.png; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required icon file missing. Add a 192×192 icon-color.png and a 32×32 icon-outline.png to copilot-studio/."
              MISSING=1
            fi
          done
          [ $MISSING -eq 0 ] || exit 1

      # ── 3. Resolve build-time tokens in declarativeAgent.json ────────────
      #   a) $[file('system-prompt.md')]  → inline the file content as a JSON string
      #   b) {tenant}                     → replace with SHAREPOINT_TENANT secret
      - name: Resolve declarativeAgent.json tokens
        env:
          SHAREPOINT_TENANT: ${{ secrets.SHAREPOINT_TENANT }}
        run: |
          python3 - << 'PYEOF'
          import json, re, os, pathlib

          src_dir = pathlib.Path("copilot-studio")
          agent_path = src_dir / "declarativeAgent.json"

          raw = agent_path.read_text(encoding="utf-8")

          # a) inline $[file('system-prompt.md')]
          def inline_file(match):
              fname = match.group(1)
              content = (src_dir / fname).read_text(encoding="utf-8")
              return json.dumps(content)          # produces a properly escaped JSON string

          raw = re.sub(r'\"\$\[file\(\'([^\']+)\'\)\]\"', inline_file, raw)

          # b) replace {tenant} placeholder
          tenant = os.environ.get("SHAREPOINT_TENANT", "")
          if not tenant:
              print("::warning ::SHAREPOINT_TENANT secret is not set — {tenant} left as-is in knowledge_sources URL.")
          raw = raw.replace("{tenant}", tenant)

          # Write resolved file to a staging area
          staging = pathlib.Path("_staging")
          staging.mkdir(exist_ok=True)
          (staging / "declarativeAgent.json").write_text(raw, encoding="utf-8")
          print("declarativeAgent.json resolved OK")
          PYEOF

      # ── 4. Resolve localization stubs (de.json / fr.json) ───────────────
      #   If the files don't exist yet we create minimal valid stubs so the
      #   manifest validator won't reject the package.
      - name: Create localization stubs if missing
        run: |
          python3 - << 'PYEOF'
          import json, pathlib

          src_dir = pathlib.Path("copilot-studio")
          staging = pathlib.Path("_staging")
          staging.mkdir(exist_ok=True)

          manifest = json.loads((src_dir / "manifest.json").read_text())
          extra_langs = manifest.get("localizationInfo", {}).get("additionalLanguages", [])

          for entry in extra_langs:
              fname = entry["file"]
              src = src_dir / fname
              if src.exists():
                  import shutil
                  shutil.copy(src, staging / fname)
                  print(f"Copied existing {fname}")
              else:
                  stub = {
                      "$schema": "https://developer.microsoft.com/en-us/json-schemas/teams/v1.20/MicrosoftTeams.Localization.schema.json",
                      "name.short": manifest["name"]["short"],
                      "name.full": manifest["name"]["full"],
                      "description.short": manifest["description"]["short"],
                      "description.full": manifest["description"]["full"]
                  }
                  (staging / fname).write_text(json.dumps(stub, indent=2, ensure_ascii=False), encoding="utf-8")
                  print(f"Created stub for {fname}")
          PYEOF

      # ── 5. Assemble the final package directory ──────────────────────────
      - name: Assemble package
        run: |
          mkdir -p _package

          # Resolved files come from _staging; originals from copilot-studio/
          cp copilot-studio/manifest.json        _package/
          cp copilot-studio/system-prompt.md     _package/
          cp copilot-studio/icon-color.png       _package/
          cp copilot-studio/icon-outline.png     _package/

          # Prefer resolved declarativeAgent.json from staging
          cp _staging/declarativeAgent.json      _package/

          # Copy any localization files (stubs or real)
          for f in _staging/*.json; do
            fname=$(basename "$f")
            [ "$fname" = "declarativeAgent.json" ] && continue
            cp "$f" _package/
          done

          echo "Package contents:"
          ls -lh _package/

      # ── 6. Determine version string ──────────────────────────────────────
      - name: Set version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"               # e.g. v1.2.0
          else
            VER="dev-$(echo ${GITHUB_SHA} | cut -c1-7)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "zip_name=smwe-copilot-agent-${VER}.zip" >> "$GITHUB_OUTPUT"

      # ── 7. Zip the package ───────────────────────────────────────────────
      - name: Zip app package
        run: |
          cd _package
          zip -r "../${{ steps.ver.outputs.zip_name }}" .
          echo "Package ready: ${{ steps.ver.outputs.zip_name }}"
          unzip -l "../${{ steps.ver.outputs.zip_name }}"

      # ── 8. Upload as workflow artifact (every run) ───────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-agent-package
          path: ${{ steps.ver.outputs.zip_name }}
          retention-days: 14

      # ── 9. Attach to GitHub Release (tagged runs only) ───────────────────
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.zip_name }}
          body: |
            ## SMWE Copilot Agent — ${{ steps.ver.outputs.version }}

            ### How to update in Partner Center
            1. Download `${{ steps.ver.outputs.zip_name }}` from the assets below
            2. Sign in to [Partner Center](https://partner.microsoft.com/dashboard)
            3. Navigate to **Marketplace offers → SMWE offer → Technical configuration**
            4. Under **App package**, upload the new `.zip`
            5. Save draft → Review and Submit

            ### What changed
            _(fill in before pushing the release tag)_
